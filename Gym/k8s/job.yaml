
apiVersion: batch/v1
kind: Job

metadata:
  name: aman-owasp-llm02
  namespace: llm-logging
  labels:
    app: owasp-llm02

spec:
  completionMode: Indexed
  completions: 8
  parallelism: 4
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400

  template:
    metadata:
      labels:
        app: owasp-llm02

    spec:
      restartPolicy: Never

      containers:
        - name: evaluator
          image: python:3.13-slim
          imagePullPolicy: IfNotPresent
          workingDir: /pipeline

          env:
            - name: POLICY_BASE_URL
              value: "http://litellm-proxy.llm-logging.svc.cluster.local:4000/v1"

            - name: POLICY_MODEL_NAME
              value: "sarvam-30b"

            - name: POLICY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: LITELLM_MASTER_KEY

            - name: SHARD_COUNT
              value: "8"

          command:
            - /bin/sh
            - -c
            - |
              set -e
              cd /pipeline

              pip install -q -e .

              python run_standalone.py \
                --input benchmarks/owasp_llm02/data/example.jsonl \
                --output "/pipeline/results/llm02/sarvam-30b/run-002/shards/shard-${JOB_COMPLETION_INDEX}.jsonl"
                --shard-index "${JOB_COMPLETION_INDEX}" \
                --shard-count 8 \
                --concurrency 2 \
                --timeout 120 \
                --limit 0

          volumeMounts:
            - name: pipeline-code
              mountPath: /pipeline

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi

      volumes:
        - name: pipeline-code
          hostPath:
            path: /home/aman/nemo_gym/Gym
            type: Directory
