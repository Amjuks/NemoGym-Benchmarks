# Example Jobs: prepare results/my-model-run first; configure node, host paths, UID/GID and env.yaml before use.
apiVersion: batch/v1
kind: Job
metadata:
  name: iheval-evaluation
  namespace: owasp-bench
  labels:
    app: native-owasp
    run-id: my-model-run
    benchmark: iheval
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: native-owasp
        run-id: my-model-run
        benchmark: iheval
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: YOUR_WORKER_NODE
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: evaluator
        image: python:3.13-slim
        imagePullPolicy: IfNotPresent
        workingDir: /workspace/Gym
        command:
        - /workspace/Gym/.venv/bin/gym
        - eval
        - run
        - --config
        - /workspace/Gym/results/my-model-run/iheval.yaml
        - --output
        - /workspace/Gym/results/my-model-run/llm02_iheval/rollouts.jsonl
        - --concurrency
        - '64'
        - --resume
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: NLTK_DATA
          value: /home/user/nltk_data
        - name: POLARS_MAX_THREADS
          value: '2'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: NEMO_GYM_MAX_ROLLOUT_ATTEMPTS
          value: '10'
        volumeMounts:
        - name: code
          mountPath: /workspace/Gym
        - name: python
          mountPath: /home/user/.local/share/uv/python
          readOnly: true
        - name: nltk
          mountPath: /home/user/nltk_data
          readOnly: true
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
          limits:
            cpu: '16'
            memory: 32Gi
      volumes:
      - name: code
        hostPath:
          path: /workspace/Gym
          type: Directory
      - name: python
        hostPath:
          path: /home/user/.local/share/uv/python
          type: Directory
      - name: nltk
        hostPath:
          path: /home/user/nltk_data
          type: Directory
      terminationGracePeriodSeconds: 120
---
