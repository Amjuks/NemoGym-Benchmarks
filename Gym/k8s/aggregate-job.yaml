
apiVersion: batch/v1
kind: Job

metadata:
  name: aman-owasp-llm02-aggregate
  namespace: llm-logging
  labels:
    app: owasp-llm02-aggregate

spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: aggregator
          image: python:3.13-slim
          imagePullPolicy: IfNotPresent
          workingDir: /pipeline

          command:
            - /bin/sh
            - -c
            - |
              set -e
              cd /pipeline

              python aggregate.py \
                --input-dir results/owasp_llm02/k8s \
                --output-dir results/owasp_llm02/k8s \
                --expected-total 3232

          volumeMounts:
            - name: pipeline-code
              mountPath: /pipeline

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi

      volumes:
        - name: pipeline-code
          hostPath:
            path: /home/aman/nemo_gym/Gym
            type: Directory
