apiVersion: batch/v1
kind: Job
metadata:
  name: aman-owasp-llm06-v4-full
  namespace: aman-owasp-bench
  labels:
    app: owasp-llm06
    benchmark-version: "4"
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 8
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: owasp-llm06
        benchmark-version: "4"
    spec:
      restartPolicy: Never
      # This hostPath checkout and results live on worker001.
      nodeSelector:
        kubernetes.io/hostname: soketlab-worker001
      containers:
        - name: evaluator
          image: python:3.13-slim
          imagePullPolicy: IfNotPresent
          workingDir: /pipeline
          env:
            - name: POLICY_BASE_URL
              value: "http://litellm-proxy.llm-logging.svc.cluster.local:4000/v1"
            - name: POLICY_MODEL_NAME
              value: "sarvam-30b"
            - name: POLICY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aman-owasp-api-keys
                  key: policy-api-key
            - name: SHARD_COUNT
              value: "8"
            # Judge configuration is independent of all POLICY_* settings.
            - name: JUDGE_BASE_URL
              value: "http://litellm-proxy.llm-logging.svc.cluster.local:4000/v1"
            - name: JUDGE_MODEL_NAME
              value: "gpt"
            - name: JUDGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aman-owasp-api-keys
                  key: judge-api-key
          command:
            - /bin/sh
            - -c
            - |
              set -e
              python - <<'PY'
              import os
              import json
              from pathlib import Path
              owner = Path('/pipeline').stat()
              run = Path('/pipeline/results/llm06/sarvam-30b/run-005-full-v4')
              for directory in (run, run / 'shards'):
                  directory.mkdir(parents=True, exist_ok=True)
                  os.chown(directory, owner.st_uid, owner.st_gid)
              config_path = '/tmp/llm06-judge-env.yaml'
              with os.fdopen(os.open(config_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600), 'w') as stream:
                  json.dump({
                      'judge_base_url': os.environ['JUDGE_BASE_URL'],
                      'judge_api_key': os.environ['JUDGE_API_KEY'],
                      'judge_model_name': os.environ['JUDGE_MODEL_NAME'],
                  }, stream)
              PY
              pip install -q -e . 'jsonschema>=4.23'
              # Fail before model inference until every source case has a scoring contract.
              python -m benchmarks.owasp_llm06.preflight \
                --input results/llm06/sarvam-30b/run-004-review-fixes/data-v4/prepared.jsonl \
                --expected-cases 4220 \
                --report "/pipeline/results/llm06/sarvam-30b/run-005-full-v4/preflight-${JOB_COMPLETION_INDEX}.json"
              python run_standalone.py \
                --risk llm06 \
                --model sarvam-30b \
                --judge-config resources_servers/owasp_llm06/configs/owasp_llm06.yaml \
                --judge-env-file /tmp/llm06-judge-env.yaml \
                --input results/llm06/sarvam-30b/run-004-review-fixes/data-v4/prepared.jsonl \
                --output "/pipeline/results/llm06/sarvam-30b/run-005-full-v4/shards/shard-${JOB_COMPLETION_INDEX}.jsonl" \
                --shard-index "${JOB_COMPLETION_INDEX}" \
                --shard-count 8 \
                --concurrency 2 \
                --timeout 120 \
                --retries 5 \
                --max-output-tokens 8192 \
                --max-turns 20 \
                --max-tool-calls 32
          volumeMounts:
            - name: pipeline-code
              mountPath: /pipeline
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: pipeline-code
          hostPath:
            path: /home/aman/nemo_gym/Gym
            type: Directory
