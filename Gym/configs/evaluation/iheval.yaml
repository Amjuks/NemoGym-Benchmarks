head_server:
  host: 127.0.0.1
  port: 43210
skip_venv_if_present: true
policy_model:
  responses_api_models:
    inference_provider:
      extra_body:
        stream: false
        truncate_prompt_tokens: null
      num_concurrent_requests: 64
      uses_reasoning_parser: true
      model: ${oc.env:MODEL,model}
      base_url: ${oc.env:MODEL_URL,http://localhost:8000/v1}
      api_key: ${evaluation.api_key}
require_complete: true
retain_results_in_memory: false
max_resident_rollout_tasks: 64
health_check_workers: 1
responses_create_params:
  max_output_tokens: 65536
num_repeats: 1
config_paths:
- benchmarks/iheval/config.yaml
- responses_api_models/inference_provider/configs/inference_provider.yaml
iheval_benchmark_simple_agent:
  responses_api_agents:
    simple_agent:
      datasets:
      - name: iheval
        type: benchmark
        jsonl_fpath: benchmarks/iheval/data/iheval_benchmark.jsonl
        prompt_config: null
        prepare_script: benchmarks/iheval/prepare.py
        num_repeats: 1
reuse_existing_data_preparation: true
route_failures_to_sidecar: true
num_samples_in_parallel: 64
split: benchmark
