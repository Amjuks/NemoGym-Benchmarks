llm06_judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${judge_base_url}
      openai_api_key: ${judge_api_key}
      openai_model: ${judge_model_name}
      upstream_request_timeout_seconds: 120
      max_http_attempts: 3
      max_rate_limit_wait_seconds: 120

# Independent judge settings. Supply judge_api_key in the private env.yaml.
# Changing policy_* never changes this model server.
judge_base_url: http://localhost:8000/v1
judge_model_name: gpt
judge_api_key: ???

owasp_llm06_resources_server:
  resources_servers:
    owasp_llm06:
      entrypoint: app.py
      domain: other
      verified: false
      judge_model_server:
        type: responses_api_models
        name: llm06_judge_model
      judge_responses_create_params:
        input: []
        temperature: 0.0
        max_output_tokens: 2048
      judge_endpoint_max_concurrency: 4
