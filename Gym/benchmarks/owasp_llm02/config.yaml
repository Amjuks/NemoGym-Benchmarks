config_paths:
- resources_servers/owasp_llm02/configs/owasp_llm02.yaml

owasp_llm02_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: owasp_llm02_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
owasp_llm02_resources_server:
  resources_servers:
    owasp_llm02:
      datasets:
      - name: owasp_llm02
        type: benchmark
        jsonl_fpath: benchmarks/owasp_llm02/data/example.jsonl
        prepare_script: benchmarks/owasp_llm02/prepare.py
        num_repeats: 1
owasp_llm02_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: owasp_llm02_agent
